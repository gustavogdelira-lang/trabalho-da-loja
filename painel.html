<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel da equipe — Guardiãs</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <!-- Entrada -->
  <form class="login" id="form-login" hidden>
    <h1>Painel da equipe</h1>
    <label for="senha">Senha da equipe</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <button class="btn btn-primario" type="submit">Entrar</button>
    <p class="erro" id="erro-login" role="alert"></p>
  </form>

  <!-- Painel -->
  <div id="area-painel" hidden>
    <header class="barra">
      <h1 id="nome-local">Alertas</h1>
      <div class="acoes">
        <span class="conexao" id="conexao" role="status">Conectando</span>
        <button class="btn btn-claro" type="button" id="btn-som">Som ligado</button>
        <a class="btn btn-claro" href="/qr">QR Codes</a>
        <button class="btn btn-claro" type="button" id="btn-sair">Sair</button>
      </div>
    </header>
    <main class="painel">
      <h2 class="titulo-lista">Em aberto</h2>
      <p class="vazio" id="vazio-abertos">Nenhum alerta em aberto. Esta tela atualiza sozinha: deixe-a aberta no celular da gerência ou da segurança.</p>
      <ul class="lista" id="lista-abertos"></ul>

      <h2 class="titulo-lista">Encerrados</h2>
      <ul class="lista" id="lista-encerrados"></ul>
    </main>
  </div>
  <script src="/painel.js"></script>
</body>
</html>
